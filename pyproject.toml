[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chaptertools"
dynamic = ["version"]
description = "Audiobook chapter alignment toolkit (silence-snap + envelope pipelines)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [{ name = "local" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.4", "ruff>=0.4"]
whisper = ["faster-whisper>=1.0"]
gui = ["customtkinter>=5.2.2"]
# pedalboard 0.9.17+ wheels require AVX2 and abort on Ivy Bridge.
quality = [
    "numpy>=1.24",
    "scipy>=1.10",
    "soundfile>=0.12",
    "noisereduce>=3.0",
    "pedalboard>=0.9.16,<0.9.17",
    "pyloudnorm>=0.1",
    "sounddevice>=0.4",
]
# resemble-enhance 0.0.1 requires torch==2.1.1, which has no Python 3.12
# wheel, so it cannot be installed here. DeepFilterNet's own pin wants
# numpy<2, which would replace the quality stack; runme.sh installs it
# without that pin.
neural = ["deepfilternet>=0.5"]

[tool.setuptools.package-data]
chaptertools = ["audio_quality/preset_data/*.json", "gui/theme.json"]

[project.scripts]
chapterfit = "chaptertools.cli.chapterfit:main"
chaptergui = "chaptertools.gui.app:main"
chapterize = "chaptertools.silence.chapterize:main"
chapterdebug = "chaptertools.silence.chapterdebug:main"
abchapters = "chaptertools.silence.abchapters:main"
consensus-chapters = "chaptertools.consensus.consensus_chapters:main"
librivox-chapters = "chaptertools.sources.librivox_chapters:main"
find-asin = "chaptertools.sources.find_asin:main"

[tool.setuptools.dynamic]
version = { attr = "chaptertools.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]
addopts = "-q"
markers = [
    "integration: needs ffmpeg and/or network",
    "whisper: needs faster-whisper venv",
]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
# moved-in legacy CLIs keep their pre-package lint scope
"src/chaptertools/cli/chapterfit.py" = ["E", "F", "I", "UP", "B", "SIM"]
"src/chaptertools/silence/chapterize.py" = ["E", "F", "I", "UP", "B", "SIM"]
"src/chaptertools/silence/chapterdebug.py" = ["E", "F", "I", "UP", "B", "SIM"]
"src/chaptertools/silence/abchapters.py" = ["E", "F", "I", "UP", "B", "SIM"]
"src/chaptertools/consensus/consensus_chapters.py" = ["E", "F", "I", "UP", "B", "SIM"]
"src/chaptertools/sources/librivox_chapters.py" = ["E", "F", "I", "UP", "B", "SIM"]
"src/chaptertools/sources/find_asin.py" = ["E", "F", "I", "UP", "B", "SIM"]
"src/chaptertools/asr.py" = ["E", "F", "I", "UP", "B", "SIM"]
"src/chaptertools/abs_client.py" = ["E", "F", "I", "UP", "B", "SIM"]
"src/chaptertools/envelope/alignment.py" = ["E", "F", "I", "UP", "B", "SIM"]
"src/chaptertools/envelope/measurement.py" = ["E", "F", "I", "UP", "B", "SIM"]
"src/chaptertools/envelope/identification.py" = ["E", "F", "I", "UP", "B", "SIM"]
"src/chaptertools/silence/alignment.py" = ["E", "F", "I", "UP", "B", "SIM"]
"src/chaptertools/silence/detection.py" = ["E", "F", "I", "UP", "B", "SIM"]
"chaptergui.py" = ["E", "F", "I", "UP", "B", "SIM"]
"tests/test_consensus_chapters.py" = ["E402", "I001"]
