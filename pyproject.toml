[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chaptertools"
version = "0.1.0"
description = "Audiobook chapter alignment toolkit (silence-snap + envelope pipelines)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [{ name = "local" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.4", "ruff>=0.4"]
whisper = ["faster-whisper>=1.0"]

[project.scripts]
chapterfit = "chaptertools.cli.chapterfit:main"
chapterize = "chaptertools.cli.chapterize:main"
chapterdebug = "chaptertools.cli.chapterdebug:main"
chaptergui = "chaptertools.gui.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]
addopts = "-q"
markers = [
    "integration: needs ffmpeg and/or network",
    "whisper: needs faster-whisper venv",
]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
"chapterfit.py" = ["E", "F", "I", "UP", "B", "SIM"]
"chapterize.py" = ["E", "F", "I", "UP", "B", "SIM"]
"chapterdebug.py" = ["E", "F", "I", "UP", "B", "SIM"]
"abchapters.py" = ["E", "F", "I", "UP", "B", "SIM"]
"consensus_chapters.py" = ["E", "F", "I", "UP", "B", "SIM"]
"librivox_chapters.py" = ["E", "F", "I", "UP", "B", "SIM"]
"find_asin.py" = ["E", "F", "I", "UP", "B", "SIM"]
"chaptergui.py" = ["E", "F", "I", "UP", "B", "SIM"]
